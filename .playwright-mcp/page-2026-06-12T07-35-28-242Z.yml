              - heading "About Me" [level=3] [ref=e131]
              - generic [ref=e132]:
                - img "profile placeholder" [ref=e134]
                - generic [ref=e135]:
                  - paragraph [ref=e136]: I'm a technology generalist based in New Zealand. My career started with freelance IT support at 17 and grew into architecting private clouds, multi-tenant voice platforms, and AI-powered automation. I work across the full stack, from bare-metal servers and network infrastructure through to TypeScript, Python, and LLM systems. I believe the best technology comes from understanding every layer between the user and the silicon.
                  - heading "Why a site like this?" [level=3] [ref=e137]
                  - paragraph [ref=e138]: This website is a tribute to the Windows XP era — the operating system where I first started tinkering with computers. Every detail from the title bar gradients to the Start menu is designed to feel like you're sitting at an XP desktop. It's a fun way to present a portfolio that stands out from the usual template-driven sites.
                  - heading "What else?" [level=3] [ref=e139]
                  - paragraph [ref=e140]: Outside of technology, I make the most of New Zealand's outdoors — hiking, trail running, and exploring the backcountry. I have a soft spot for retro computing and classic games, which is part of why this site exists. I'm drawn to projects that combine nostalgia with modern engineering.
                  - paragraph [ref=e141]: When I'm not outdoors or at a keyboard, I'm usually reading about AI and system design, experimenting with language models, or tinkering with hardware. I went back to first principles to study how transformers actually work, and I'm fascinated by the intersection of infrastructure, automation, and machine intelligence. I also care about the commercial side — how technology creates value, not just how it works.
